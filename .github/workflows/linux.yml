name: Linux build

# Azahar at the commit in port/azahar/COMMIT, with port/azahar/azahar.patch and the port's
# CPU backend, built as an AppImage the way Azahar's own CI builds its Linux release. It
# contains no game code: the game's code library is made on the player's machine from their
# own dump (tools/build_game.py) and loaded at run time. Published under the repository's
# licence (GPL-3.0-or-later, like Azahar) with the matching source (this repository at the
# built commit, Azahar at port/azahar/COMMIT plus port/azahar/azahar.patch). The headless
# mh4u_runner isn't included: outside the AppImage it needs the libraries the AppImage bundles.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "port/**"
      - "tools/**"
      - "config/**"
      - ".github/workflows/linux.yml"

jobs:
  appimage:
    runs-on: ubuntu-latest
    container:
      image: opensauce04/azahar-build-environment:latest
      options: -u 1001
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - uses: actions/checkout@v4
        with:
          path: mh4u
      - name: Azahar at the pinned commit, with the port's patch
        run: |
          git clone https://github.com/azahar-emu/azahar.git azahar
          cd azahar
          git checkout "$(cat ../mh4u/port/azahar/COMMIT)"
          git submodule update --init --recursive --depth 1
          git apply ../mh4u/port/azahar/azahar.patch
      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: linux-${{ hashFiles('mh4u/port/azahar/COMMIT') }}-${{ github.sha }}
          restore-keys: linux-${{ hashFiles('mh4u/port/azahar/COMMIT') }}-
      - name: Build
        env:
          # the Qt Wayland plugins Azahar bundles in its own AppImage
          EXTRA_QT_PLUGINS: waylandcompositor
          EXTRA_PLATFORM_PLUGINS: libqwayland-egl.so;libqwayland-generic.so
        run: |
          mkdir -p azahar/build && cd azahar/build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_LINKER=/etc/bin/ld.lld \
            -DENABLE_ROOM_STANDALONE=OFF \
            -DENABLE_TESTS=OFF \
            -DMH4U_PORT_DIR="${GITHUB_WORKSPACE}/mh4u/port"
          ninja
          strip -s bin/Release/*
          ninja bundle
          ccache -s
      - name: Package
        if: ${{ hashFiles('mh4u/LICENSE') != '' }}
        run: |
          mkdir -p artifacts/mh4u-port-linux/mh4u-tools
          cp azahar/build/bundle/*.AppImage artifacts/mh4u-port-linux/azahar-mh4u.AppImage
          cp mh4u/LICENSE artifacts/mh4u-port-linux/LICENSE-mh4u-port.txt
          cp azahar/LICENSE.txt artifacts/mh4u-port-linux/LICENSE-azahar.txt
          # the tools that build the game's code library from the player's own update
          cp -r mh4u/tools mh4u/config artifacts/mh4u-port-linux/mh4u-tools/
          find artifacts/mh4u-port-linux/mh4u-tools -name __pycache__ -prune -exec rm -rf {} +
          cp mh4u/LICENSE artifacts/mh4u-port-linux/mh4u-tools/
          cp mh4u/port/unix/build-code-library.sh artifacts/mh4u-port-linux/
          chmod +x artifacts/mh4u-port-linux/build-code-library.sh artifacts/mh4u-port-linux/azahar-mh4u.AppImage
          cat > artifacts/mh4u-port-linux/README-mh4u.txt <<EOF
          Azahar ($(cat mh4u/port/azahar/COMMIT)) with the MH4U port's recompiled-code CPU backend,
          as an AppImage. Source: https://github.com/${GITHUB_REPOSITORY} (commit ${GITHUB_SHA}),
          https://github.com/azahar-emu/azahar plus mh4u/port/azahar/azahar.patch.

          No game code is included. To play, with your own decrypted Monster Hunter 4 Ultimate
          (USA) and its v1.3.0 update (.cia):
          1. Python 3.10 or newer (most distributions have it; on a Steam Deck too).
          2. Run ./build-code-library.sh (or double-click it) and choose your v1.3.0 update .cia:
             it builds the game's code library on this computer (with clang if installed,
             otherwise it downloads Zig's C compiler, about 80 MB) and installs it in
             ~/.local/share/azahar-emu/recomp.
          3. Start azahar-mh4u.AppImage: File > Install CIA... (the update), then File > Load
             File... (the game).
          Options: Tools > MH4U Port Options... in Azahar, and docs/PLAYING.md in the repository.
          The artifact zip doesn't keep file permissions: if the two files don't start, run
          chmod +x azahar-mh4u.AppImage build-code-library.sh first.
          EOF
      - name: Upload
        if: ${{ hashFiles('mh4u/LICENSE') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mh4u-port-linux
          path: artifacts/
          retention-days: 14
